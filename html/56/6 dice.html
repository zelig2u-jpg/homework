<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    body
    {display: grid; 
        grid-template-rows: repeat(22, 1fr);
        grid-template-columns:repeat(10,1fr); 
    }
    .circle {
      width: 50px;
      height: 50px;
      background-color: black;
      color: white;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      font-size: 20px;
      user-select: none;
    }
    h1{grid-column:2;
    grid-row: 2;}
    h2{grid-column:1;
    grid-row: 4;}
    h3{grid-column:3;
    grid-row: 6;}
    h4{grid-column:1;
    grid-row: 10;}
    h5{grid-column:2;
    grid-row: 11;}
    h6{grid-column:3;
    grid-row: 12;}
    h8{grid-column:1;
    grid-row: 13;}
     h9{grid-column:3;
    grid-row: 13;}
     h10{grid-column:1;
    grid-row: 15;}
     h11{grid-column:3;
    grid-row: 15;}
     h12{grid-column:1;
    grid-row: 16;}
     h13{grid-column:3;
    grid-row: 16;}
     h14{grid-column:2;
    grid-row: 17;}
     h15{grid-column:1;
    grid-row: 18;}
     h16{grid-column:3;
    grid-row: 18;}
     h17{grid-column:1;
    grid-row: 19;}
     h18{grid-column:1;
    grid-row: 20;}
     h19{grid-column:1;
    grid-row: 21;}
     h20{grid-column:3;
    grid-row: 19;}
     h21{grid-column:3;
    grid-row: 20;}
     h22{grid-column:3;
    grid-row: 21;}
    
  </style>
</head>
<body>
  <h1><div class="circle"></div></h1>
  <h2><div class="circle"></div></h2>
  <h3><div class="circle"></div></h3>
  <h4><div class="circle"></div></h4>
  <h5><div class="circle"></div></h5>
  <h6><div class="circle"></div></h6>
  
  <h8><div class="circle"></div></h8>
  <h9><div class="circle"></div></h9>
  <h10><div class="circle"></div></h10>
  <h11><div class="circle"></div></h11>
  <h12><div class="circle"></div></h12>
  <h13><div class="circle"></div></h13>
  <h14><div class="circle"></div></h14>
  <h15><div class="circle"></div></h15>
  <h16><div class="circle"></div></h16>
  <h17><div class="circle"></div></h17>
  <h18><div class="circle"></div></h18>
  <h19><div class="circle"></div></h19>
  <h20><div class="circle"></div></h20>
  <h21><div class="circle"></div></h21>
  <h22><div class="circle"></div></h22>




</body>
</html>
