<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Map Example</title>
    <style>
      html, body, #map {
        width: 100%;
        height: 100%;
        margin: 0;
      }
      #form {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1000;
        background: rgba(255,255,255,0.95);
        padding: 8px;
        border-radius: 6px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
      }
      .map-icon { width: 64px; height: auto; display:block; }
      #sidebar { position: absolute; right: 12px; top: 12px; z-index:1000;
                 background:#fff;padding:8px;border-radius:6px; max-width:320px; max-height:70vh; overflow:auto;}
      #places { list-style:none; padding:0; margin:0; }
      #places li { margin-bottom:8px; border-bottom:1px solid #eee; padding-bottom:6px;}
    </style>
  </head>
  <body>
    <div id="map"></div>

    <form id="form" action="/search" method="get" role="search" aria-label="Site search">
      <label for="search" class="visually-hidden">Search</label>
      <input id="search" name="q" type="search" placeholder="Search..." aria-label="Search query" />
      <button type="submit">Search</button>
    </form>

    <div id="sidebar"><ul id="places"></ul></div>

    <script>
      ((g) => {
        var h, a, k,
          p = 'The Google Maps JavaScript API',
          c = 'google',
          l = 'importLibrary',
          q = '__ib__',
          m = document,
          b = window;
        b = b[c] || (b[c] = {});
        var d = b.maps || (b.maps = {}),
          r = new Set(),
          e = new URLSearchParams(),
          u = () => h || (h = new Promise(async (f, n) => {
            await (a = m.createElement('script'));
            e.set('libraries', [...r] + '');
            for (k in g) e.set(k.replace(/[A-Z]/g, (t) => '_' + t[0].toLowerCase()), g[k]);
            e.set('callback', c + '.maps.' + q);
            a.src = `https://maps.${c}apis.com/maps/api/js?` + e;
            d[q] = f;
            a.onerror = () => (h = n(Error(p + ' could not load.')));
            a.nonce = m.querySelector('script[nonce]')?.nonce || '';
            m.head.append(a);
          }));
        d[l] ? console.warn(p + ' only loads once. Ignoring:', g) : (d[l] = (f, ...n) => r.add(f) && u().then(() => d[l](f, ...n)));
      })({
        key: 'AIzaSyDAeV5HLgLpPcFmTQ1IC642ChCLDSmCojg',
        v: 'weekly'
      });
    </script>

    <script src="map.js" type="module"></script>
  </body>
</html>
