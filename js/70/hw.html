<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      html{background-color: green;}
      .box {
        
        width: 100px;
        height: 100px;
        

        position: absolute;
      }
      #potato3 {
        position: absolute;
        top: 15%;
        left: 25%;
        width: 500px;
        height: 500px;
      }
#eye1, #eye2, #eye3, #eye4, #eyebrow1, #eyebrow2 {
        position: absolute;
        top: 100px;
        left: 100px;
        width: 150px;
        height: 75px;
        display: inline-block;
      }
      #mouth, #mouth1, #nose, #nose2 {
        position: absolute;
        top: 100px;
        left: 100px;
        width: 250px;
        height: 150px;
      }
    </style>
  </head>
  <body>
    

    <audio controls loop autoplay>
          <source src="images\Eitan_Katz_-_V'nacha.mp3" type="audio/mpeg" />
    </audio>
    <div class="box" ></div>
<img id="potato3" src="images\potato3.webp" alt="">
<img class="box" id="mouth" src="images\mouth.webp" alt="">
<img class="box" id="eye1" src="images\eye1.webp" alt="">
<img class="box" id="eye2" src="images\eye2.webp" alt="">
<img class="box" id="eye3" src="images\eye3.webp" alt="">
<img class="box" id="eye4" src="images\eye4.webp" alt="">
<img class="box" id="eyebrow1" src="images\eyebrow1.webp" alt="">
<img class="box" id="eyebrow2" src="images\eyebrow2.webp" alt="">
<img class="box" id="mouth1" src="images\mouth1.webp" alt="">
<img class="box" id="nose" src="images\nose.webp" alt="">
<img class="box" id="nose2" src="images\nose2.webp" alt="">


    <script src="mrpotatohead.js" type="module"></script>
  </body>
</html>
